- id: dyson-swarm
  name: "DYSON SWARM"
  year: "2025"
  status:
    es: "Prototipo"
    en: "Prototype"
  image: "/assets/images/swarm/DysonSwarm.png"
  technologies: [Simulation, Real-time, Orbital systems]
  repository: "https://github.com/corvo001/DysonSwarm"
  summary:
    es: "Dyson Swarm es un simulador interactivo para diseñar y explorar enjambres de satélites alrededor de una estrella. Permite modificar su cantidad, escala y distribución orbital en tiempo real, observar métricas de cobertura y captación energética, y comparar diferentes arquitecturas de colectores solares a escala astronómica."
    en: "Dyson Swarm is an interactive simulator for designing and exploring satellite swarms around a star. It allows their quantity, scale and orbital distribution to be adjusted in real time, exposes coverage and energy-capture metrics, and supports comparison between different astronomical-scale solar collector architectures."
  gallery:
    - "/assets/images/swarm/DysonSwarm_2.png"
    - "/assets/images/swarm/DysonSwarm_3.png"

- id: union
  name: "UNION"
  year: "2025"
  status:
    es: "Experimental"
    en: "Experimental"
  image: "/assets/images/union/Imagen-del-proyecto.png"
  technologies: [Fractals, Generative systems, Real-time]
  repository: "https://github.com/corvo001/UNION"
  summary:
    es: "UNION es un motor experimental para generar, transformar y analizar geometrías fractales en tiempo real. Combina funciones matemáticas, deformaciones y morfología dinámica en un entorno manipulable, pensado para descubrir patrones y explorar aplicaciones de la geometría compleja en investigación, arte generativo y prototipado visual."
    en: "UNION is an experimental engine for generating, transforming and analysing fractal geometries in real time. It combines mathematical functions, deformation and dynamic morphology in a manipulable environment built to uncover patterns and explore complex geometry across research, generative art and visual prototyping."
  gallery:
    - "/assets/images/union/capture_144410.png"
    - "/assets/images/union/capture_144459.png"
    - "/assets/images/union/capture_144414.png"
