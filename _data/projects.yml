  status:
    es: "En desarrollo"
    en: "In development"
  image: "/assets/images/aiden/aiden-cover.jpg"
  technologies: [Python, OSINT, Debian]
  repository: ""
  summary:
    es: "AIDEN es una plataforma modular de investigación OSINT diseñada para descubrir, correlacionar y organizar información pública procedente de distintas fuentes. Su arquitectura integra herramientas especializadas dentro de un flujo reproducible, facilitando el análisis de identidades, relaciones y resultados sin perder trazabilidad durante la investigación."
    en: "AIDEN is a modular OSINT research platform designed to discover, correlate and organise public information from multiple sources. Its architecture brings specialist tools into one reproducible workflow, making it easier to analyse identities, relationships and results while preserving traceability throughout an investigation."
