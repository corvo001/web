  hidden: true
  year: "2026"
  status:
    es: "En desarrollo"
    en: "In development"
  image: "/assets/images/aiden/aiden-cover.jpg"
  technologies: [Python, OSINT, Debian, Termux]
  repository: ""
  summary:
    es: "Plataforma modular para investigación OSINT, correlación de identidades y análisis de información pública."
    en: "A modular platform for OSINT research, identity correlation and public-information analysis."
  description:
    es: |
      AIDEN es una plataforma modular de OSINT construida alrededor de herramientas especializadas y orientada a investigar, correlacionar y visualizar información pública.

      Su arquitectura separa el descubrimiento, la extracción, la correlación, la visualización y la generación de informes. El objetivo es integrar distintas fuentes y motores de investigación dentro de un entorno único, reproducible y extensible.
    en: |
      AIDEN is a modular OSINT platform built around specialist tools to investigate, correlate and visualise public information.

      Its architecture separates discovery, extraction, correlation, visualisation and report generation. The aim is to integrate multiple sources and research engines in a single reproducible, extensible environment.
