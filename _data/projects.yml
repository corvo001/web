  summary:
    es: "AIDEN es una plataforma modular de investigación OSINT diseñada para descubrir, correlacionar y organizar información pública procedente de distintas fuentes. Su arquitectura integra herramientas especializadas dentro de un flujo reproducible, facilitando el análisis de identidades, relaciones y resultados sin perder trazabilidad durante la investigación."
