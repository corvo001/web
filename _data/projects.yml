- id: dyson-swarm
  name: "DYSON SWARM"
  year: "2025"
  category: "SOFTWARE"
  image: "/assets/images/swarm/DysonSwarm.png"
  video: "/assets/videos/dyson-swarm-preview.webm"
  preview_video: "/assets/videos/dyson-swarm-loop.webm"
  technologies: [Simulation, Real-time]
  repository: "https://github.com/corvo001/DysonSwarm"
  summary:
    es: "Dyson Swarm es un simulador interactivo para diseñar y explorar enjambres de satélites alrededor de una estrella. Permite modificar su cantidad, escala y distribución orbital en tiempo real, observar métricas de cobertura y comparar diferentes arquitecturas de colectores solares a escala astronómica."
    en: "Dyson Swarm is an interactive simulator for designing and exploring satellite swarms around a star. It allows their quantity, scale and orbital distribution to be adjusted in real time, exposes coverage metrics, and supports comparison between different astronomical-scale solar collector architectures."
  seo_description:
    es: "DYSON SWARM es un simulador interactivo para diseñar enjambres de satélites y comparar arquitecturas de colectores solares alrededor de una estrella."
    en: "DYSON SWARM is an interactive simulator for designing satellite swarms and comparing solar-collector architectures around a star."
