<!doctype html>
<html lang="{{ page.lang | default: 'es' }}">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% if page.title %}{{ page.title }} — {% endif %}{{ site.title }}</title>
    <meta name="description" content="{{ page.description | default: site.description | strip_html | strip_newlines }}">
    <link rel="canonical" href="{{ page.url | absolute_url }}">
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="Daniel Cuervo">
    <meta property="og:title" content="{% if page.layout == 'project' %}{{ page.title }} — Daniel Cuervo{% else %}{{ site.title }}{% endif %}">
    <meta property="og:description" content="{{ page.description | default: site.description | strip_html | strip_newlines }}">
    <meta property="og:url" content="{{ page.url | absolute_url }}">
    <meta property="og:locale" content="{% if page.lang == 'en' %}en_US{% else %}es_ES{% endif %}">
    <meta property="og:image" content="{{ '/assets/images/social-preview-v2.png' | absolute_url }}">
    <meta property="og:image:secure_url" content="{{ '/assets/images/social-preview-v2.png' | absolute_url }}">
    <meta property="og:image:type" content="image/png">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta property="og:image:alt" content="Daniel Cuervo — Software, robotics and industrial automation portfolio">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="{% if page.layout == 'project' %}{{ page.title }} — Daniel Cuervo{% else %}{{ site.title }}{% endif %}">
    <meta name="twitter:description" content="{{ page.description | default: site.description | strip_html | strip_newlines }}">
    <meta name="twitter:image" content="{{ '/assets/images/social-preview-v2.png' | absolute_url }}">
    <link rel="icon" href="{{ '/assets/images/logo-original-transparent.png' | relative_url }}" type="image/png">
    <link rel="apple-touch-icon" href="{{ '/assets/images/logo-original-transparent.png' | relative_url }}">
    <meta name="theme-color" content="#090b0a" media="(prefers-color-scheme: dark)">
    <meta name="theme-color" content="#f3f4ef" media="(prefers-color-scheme: light)">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preconnect" href="https://fonts.cdnfonts.com">
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link href="https://fonts.cdnfonts.com/css/dune-rise" rel="stylesheet">
    {% if page.body_class == 'language-page' %}
    <script>
      try {
        if (history.state?.eyeGateReturn === true || sessionStorage.getItem('portfolio-eye-return') === '1' || sessionStorage.getItem('portfolio-eye-entered') === '1') {
          document.documentElement.classList.add('gate-return-boot', 'gate-return-mode');
        }
      } catch (error) {}
    </script>
    {% endif %}
    {% if page.layout == 'project' %}
    <script>
      try {
        if (sessionStorage.getItem('portfolio-project-transition')) document.documentElement.classList.add('project-entry-boot');
      } catch (error) {}
    </script>
    {% endif %}
    <link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}?v={{ site.time | date: '%s' }}">
  </head>
  <body class="portfolio-shell{% if page.body_class %} {{ page.body_class }}{% endif %}">
    {{ content }}
    <script src="{{ '/assets/js/portfolio.js' | relative_url }}?v={{ site.time | date: '%s' }}" defer></script>
  </body>
</html>
