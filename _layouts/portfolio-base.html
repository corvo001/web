<!doctype html>
<html lang="{{ page.lang | default: 'es' }}">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% if page.title %}{{ page.title }} — {% endif %}{{ site.title }}</title>
    <meta name="description" content="{{ page.description | default: site.description | strip_html | strip_newlines }}">
    <link rel="icon" href="{{ '/assets/images/logo-white.png' | relative_url }}" type="image/png">
    <link rel="apple-touch-icon" href="{{ '/assets/images/logo-white.png' | relative_url }}">
    <meta name="theme-color" content="#090b0a" media="(prefers-color-scheme: dark)">
    <meta name="theme-color" content="#f3f4ef" media="(prefers-color-scheme: light)">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preconnect" href="https://fonts.cdnfonts.com">
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link href="https://fonts.cdnfonts.com/css/dune-rise" rel="stylesheet">
    {% if page.body_class == 'language-page' %}
    <script>
      try {
        if (history.state?.eyeGateReturn === true || sessionStorage.getItem('portfolio-eye-return') === '1' || sessionStorage.getItem('portfolio-eye-entered') === '1') {
          document.documentElement.classList.add('gate-return-boot', 'gate-return-mode');
        }
      } catch (error) {}
    </script>
    {% endif %}
    <link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}?v={{ site.time | date: '%s' }}">
  </head>
  <body class="portfolio-shell{% if page.body_class %} {{ page.body_class }}{% endif %}">
    {{ content }}
    <script src="{{ '/assets/js/portfolio.js' | relative_url }}?v={{ site.time | date: '%s' }}" defer></script>
  </body>
</html>
